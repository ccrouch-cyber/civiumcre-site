<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Civium</title>
<meta name="description" content="Civium reads a seller's rent roll and T-12 with deterministic code and shows the buyer's team every number with its receipt.">
<style>
  :root { --gold:#b49a5c; --gold-deep:#997f43; --ink:#2b2620; --fade:#8a7f6d; --paper:#f6f1e6; --line:#e4dcc8;
          --serif: Georgia, 'Iowan Old Style', 'Times New Roman', serif;
          --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  html, body { margin:0; background:var(--paper); color:var(--ink); font:15px/1.5 var(--sans); }
  main { max-width: 720px; margin: 0 auto; padding: 96px 24px; }
  .brand { font-family: var(--serif); font-size: 32px; letter-spacing: 9px; color: var(--gold); }
  p { margin: 20px 0 0; }
  .mut { color: var(--fade); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; margin-top: 40px; }
</style>
</head>
<body>
<main>
  <div class="brand">CIVIUM</div>
  <p>Civium reads a seller's rent roll and T-12 with deterministic code and shows the buyer's team every number with its receipt.</p>
  <p class="mut">The site is being designed. Invitations open soon.</p>
</main>
</body>
</html>
