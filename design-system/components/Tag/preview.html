<!-- @dsCard group="Signals" height=72 -->
<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;padding:16px;background:var(--paper);color:var(--ink);font:13px/1.45 var(--font-sans);font-variant-numeric:tabular-nums lining-nums}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-card);padding:14px 16px;box-shadow:var(--shadow-1)}
.eyebrow{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--fade)}
.eyebrow.gold{color:var(--gold-deep)}
.tiny{font-size:11px} .mut{color:var(--fade)}
.btn{font:12.5px/1.3 var(--font-sans);border-radius:var(--radius-control);cursor:pointer;padding:6px 14px;border:1px solid transparent}
.btn-primary{background:var(--gold);color:var(--on-gold)} .btn-ghost{background:none;border-color:var(--gold);color:var(--gold-deep)}
.btn-ink{background:var(--ink);color:var(--on-gold)} .btn-sm{padding:3px 10px;font-size:11.5px;border-radius:var(--radius-control-sm)}
.btn-link{background:none;border:none;color:var(--gold-deep);font-size:12.5px;padding:0;cursor:pointer}
.btn:disabled{opacity:.45}
.tag{font-size:10px;color:var(--fade);border:1px solid var(--line);border-radius:var(--radius-tag);padding:1px 8px;white-space:nowrap}
.tag.good{color:var(--green);border-color:var(--green);background:var(--green-wash)}
.tag.warn{color:var(--red);border-color:var(--red);background:var(--red-wash)}
.tag.gold{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.tag.assume{color:var(--amber);border-color:var(--gold-soft);font-size:9px}
.pill{border-radius:var(--radius-pill);padding:4px 12px;font-size:12px;cursor:pointer;border:1px solid var(--gold);background:none;color:var(--gold-deep)}
.pill.on{background:var(--gold);color:var(--on-gold)} .pill.sm{padding:2px 9px;font-size:10.5px;border-radius:11px}
.inp{font:12.5px var(--font-sans);color:var(--ink);padding:4px 7px;border:1px solid var(--line);border-radius:var(--radius-control);background:#fff}
.inp.focus{border-color:var(--gold);box-shadow:var(--ring)} .inp.bad{border-color:var(--red);box-shadow:var(--ring-red)}
.inp.busy{border-color:var(--gold);background:var(--gold-wash)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tab{border:none;background:none;font:14.5px var(--font-serif);padding:7px 14px 9px;color:var(--fade);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--ink);border-bottom-color:var(--gold)}
.serif{font-family:var(--font-serif)} .metric{font:19px var(--font-serif)}

</style></head><body><div class="row"><span class="tag">96 units</span><span class="tag good">ready</span><span class="tag warn">with Civium</span><span class="tag warn">not taken</span><span class="tag gold">Bid</span><span class="tag assume">assumed</span></div></body></html>
