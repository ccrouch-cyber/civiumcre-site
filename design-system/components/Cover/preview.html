<!-- @dsCard height=288 -->
<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:var(--paper);color:var(--ink)}
.wrap{position:relative;width:960px;height:288px;overflow:hidden}
.name{position:absolute;left:32px;bottom:44px;font:120px/0.92 var(--font-serif);letter-spacing:6px;color:var(--ink);margin:0}
.tag{position:absolute;left:36px;bottom:20px;font:13px/1.3 var(--font-sans);color:var(--fade);max-width:440px}
.gold{fill:var(--gold)} .deep{fill:var(--gold-deep)} .ink{fill:var(--ink)} .soft{fill:var(--gold-soft)} .card{fill:var(--card)}
.rule{stroke:var(--line);stroke-width:1} .tile{rx:10px}
</style></head><body><div class="wrap">
<!-- derivation:
     blocks: gold 224x176 · gold-deep 96x176 · ink 320x64 · gold-soft 128x96 · card 96x96 — sides are multiples of the 16px step (sp-4) and the 24px gutter
     arrangement: a staggered stack against the right edge, one tall gold slab with a deep gold satellite, the ink band under, the tint bleeding off the top
     pattern: editorial serif, "borders not shadows" -> four hairline rules at the line token crossing the blocks, on a 48px pitch (3 x sp-4); never a field
     scales: radius-card 10px on every tile; pitch 48px; gap 16px; nothing crosses x < 480 -->
<svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
  <rect class="tile soft" x="640" y="-24" width="128" height="96"/>
  <rect class="tile gold" x="512" y="40" width="224" height="176"/>
  <rect class="tile deep" x="752" y="40" width="96" height="176"/>
  <rect class="tile card" x="864" y="120" width="96" height="96"/>
  <rect class="tile ink" x="576" y="232" width="320" height="64"/>
  <line class="rule" x1="480" y1="88" x2="960" y2="88"/>
  <line class="rule" x1="480" y1="136" x2="960" y2="136"/>
  <line class="rule" x1="480" y1="184" x2="960" y2="184"/>
  <line class="rule" x1="480" y1="232" x2="960" y2="232"/>
</svg>
<h1 class="name">Civium</h1>
<div class="tag">Warm paper, gold and ink, serif headings, tabular numerals everywhere.</div>
</div></body></html>
