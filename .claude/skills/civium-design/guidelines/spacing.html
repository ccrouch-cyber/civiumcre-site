<!-- @dsCard group="Spacing" viewport="700x120" name="Spacing scale" subtitle="4 / 8 / 12 / 16, gutter 24, shell 1180" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.s{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}.s i{display:block;height:56px}.s div{padding:6px 8px;font:11px/1.4 var(--sans)}.s b{font-weight:400;color:var(--ink);display:block}.s span{color:var(--fade)}</style></head><body><div style="display:flex;gap:24px;align-items:flex-end"><div><div style="width:4px;height:4px;background:var(--gold)"></div><div class="tiny" style="margin-top:6px">sp-1<br><span class="mut">4px</span></div></div><div><div style="width:8px;height:8px;background:var(--gold)"></div><div class="tiny" style="margin-top:6px">sp-2<br><span class="mut">8px</span></div></div><div><div style="width:12px;height:12px;background:var(--gold)"></div><div class="tiny" style="margin-top:6px">sp-3<br><span class="mut">12px</span></div></div><div><div style="width:16px;height:16px;background:var(--gold)"></div><div class="tiny" style="margin-top:6px">sp-4<br><span class="mut">16px</span></div></div><div><div style="width:24px;height:24px;background:var(--gold)"></div><div class="tiny" style="margin-top:6px">gutter<br><span class="mut">24px</span></div></div><div class="tiny mut" style="margin-left:auto;max-width:200px">shell max-width 1180px; gutter is the shell's side padding and the page's top margin</div></div></body></html>
