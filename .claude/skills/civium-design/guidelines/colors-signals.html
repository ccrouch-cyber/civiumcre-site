<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.s{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}.s i{display:block;height:56px}.s div{padding:6px 8px;font:11px/1.4 var(--sans)}.s b{font-weight:400;color:var(--ink);display:block}.s span{color:var(--fade)}</style></head><body><div class="sw"><div class="s"><i style="background:var(--green)"></i><div><b>green</b><span>#3f7d3f</span></div></div><div class="s"><i style="background:var(--green-wash)"></i><div><b>green-wash</b><span>#eef3e9</span></div></div><div class="s"><i style="background:var(--red)"></i><div><b>red</b><span>#a33232</span></div></div><div class="s"><i style="background:var(--red-wash)"></i><div><b>red-wash</b><span>#f6e7e7</span></div></div><div class="s"><i style="background:var(--amber)"></i><div><b>amber</b><span>#9a7b2d</span></div></div><div class="s"><i style="background:var(--orange)"></i><div><b>orange</b><span>#b06226</span></div></div></div></body></html>
