<!-- @dsCard group="Colors" viewport="700x120" name="Ink" subtitle="Text, from body to faintest" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.s{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}.s i{display:block;height:56px}.s div{padding:6px 8px;font:11px/1.4 var(--sans)}.s b{font-weight:400;color:var(--ink);display:block}.s span{color:var(--fade)}</style></head><body><div class="sw"><div class="s"><i style="background:var(--ink)"></i><div><b>ink</b><span>#2b2620</span></div></div><div class="s"><i style="background:var(--ink-soft)"></i><div><b>ink-soft</b><span>#5d5546</span></div></div><div class="s"><i style="background:var(--fade)"></i><div><b>fade</b><span>#8a7f6d</span></div></div><div class="s"><i style="background:var(--faint)"></i><div><b>faint</b><span>#cfc6b0</span></div></div></div></body></html>
