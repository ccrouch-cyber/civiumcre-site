<!-- @dsCard group="Spacing" viewport="700x120" name="Radii" subtitle="Cards 10, panels 8, controls 6/5, tags & pills round" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.s{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}.s i{display:block;height:56px}.s div{padding:6px 8px;font:11px/1.4 var(--sans)}.s b{font-weight:400;color:var(--ink);display:block}.s span{color:var(--fade)}</style></head><body><div style="display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap"><div><div style="width:84px;height:56px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-card)"></div><div class="tiny" style="margin-top:6px">radius-card<br><span class="mut">10px</span></div></div><div><div style="width:84px;height:56px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-panel)"></div><div class="tiny" style="margin-top:6px">radius-panel<br><span class="mut">8px</span></div></div><div><div style="width:84px;height:30px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-control)"></div><div class="tiny" style="margin-top:6px">radius-control<br><span class="mut">6px</span></div></div><div><div style="width:70px;height:24px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-control-sm)"></div><div class="tiny" style="margin-top:6px">radius-control-sm<br><span class="mut">5px</span></div></div><div><div style="width:60px;height:18px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-tag)"></div><div class="tiny" style="margin-top:6px">radius-tag<br><span class="mut">9px</span></div></div><div><div style="width:80px;height:28px;border:1px solid var(--line);background:var(--card);border-radius:var(--radius-pill)"></div><div class="tiny" style="margin-top:6px">radius-pill<br><span class="mut">14px</span></div></div></div></body></html>
