<!-- @dsCard group="Spacing" viewport="700x130" name="Shadows & rings" subtitle="Borders carry the edge; shadows whisper" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.s{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}.s i{display:block;height:56px}.s div{padding:6px 8px;font:11px/1.4 var(--sans)}.s b{font-weight:400;color:var(--ink);display:block}.s span{color:var(--fade)}</style></head><body><div style="display:flex;gap:18px;flex-wrap:wrap"><div><div style="width:130px;height:54px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-1)"></div><div class="tiny" style="margin-top:8px">shadow-1<br><span class="mut">card at rest</span></div></div><div><div style="width:130px;height:54px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow-2)"></div><div class="tiny" style="margin-top:8px">shadow-2<br><span class="mut">clickable card, hovered</span></div></div><div><div style="width:130px;height:54px;background:var(--card);border:1px solid var(--gold);border-radius:6px;box-shadow:var(--ring)"></div><div class="tiny" style="margin-top:8px">ring<br><span class="mut">focus (gold)</span></div></div><div><div style="width:130px;height:54px;background:var(--card);border:1px solid var(--red);border-radius:6px;box-shadow:var(--ring-red)"></div><div class="tiny" style="margin-top:8px">ring-red<br><span class="mut">bad input</span></div></div></div></body></html>
