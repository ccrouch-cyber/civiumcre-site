<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.s{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}.s i{display:block;height:56px}.s div{padding:6px 8px;font:11px/1.4 var(--sans)}.s b{font-weight:400;color:var(--ink);display:block}.s span{color:var(--fade)}</style></head><body><div class="sw"><div class="s"><i style="background:var(--paper)"></i><div><b>paper</b><span>#f6f1e6</span></div></div><div class="s"><i style="background:var(--card)"></i><div><b>card</b><span>#fffdf8</span></div></div><div class="s"><i style="background:var(--wash)"></i><div><b>wash</b><span>#faf6ea</span></div></div><div class="s"><i style="background:var(--zebra)"></i><div><b>zebra</b><span>#faf6ec</span></div></div><div class="s"><i style="background:var(--line)"></i><div><b>line</b><span>#e4dcc8</span></div></div><div class="s"><i style="background:var(--line-soft)"></i><div><b>line-soft</b><span>#efe8d6</span></div></div></div></body></html>
