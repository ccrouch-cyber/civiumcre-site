<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:16px}.sw{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}.s{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}.s i{display:block;height:56px}.s div{padding:6px 8px;font:11px/1.4 var(--sans)}.s b{font-weight:400;color:var(--ink);display:block}.s span{color:var(--fade)}</style></head><body><div class="sw"><div class="s"><i style="background:var(--gold)"></i><div><b>gold</b><span>#b49a5c</span></div></div><div class="s"><i style="background:var(--gold-deep)"></i><div><b>gold-deep</b><span>#997f43</span></div></div><div class="s"><i style="background:var(--gold-soft)"></i><div><b>gold-soft</b><span>#e8dcbf</span></div></div><div class="s"><i style="background:var(--gold-wash)"></i><div><b>gold-wash</b><span>#faf4e3</span></div></div><div class="s"><i style="background:var(--on-gold)"></i><div><b>on-gold</b><span>#ffffff</span></div></div></div></body></html>
